startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      groqApiKey:
        type: string
        description: Groq API key (required for NL report creation and image theming)
      outputDir:
        type: string
        description: Local folder where .pbit files are saved (default: generated_reports/)
    required: []
  commandFunction: |-
    (config) => ({
      command: "python",
      args: ["mcp_stdio.py"],
      env: {
        ...(config.groqApiKey ? { GROQ_API_KEY: config.groqApiKey } : {}),
        ...(config.outputDir ? { OUTPUT_DIR: config.outputDir } : {})
      }
    })